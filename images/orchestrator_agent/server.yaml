# server.yaml — how the agent is served (same schema as the simple agent).
# Reference: images/simple_agent/README.md#serveryaml
agent_card:
  display_name: Orchestrator Agent
  description: Delegates tasks across specialist A2A agents, with OpenAI-compatible and A2A interfaces.
  version: "1.0.0"
  skills: []
  # skills:
  #   - id: orchestration
  #     name: Task Orchestration
  #     description: Coordinates specialist agents to fulfill multi-step requests.
  #     tags: [orchestration, routing]

interfaces:
  openai: true
  a2a: true

a2a:
  response_mode: auto # delegation usually makes this a task with streamed activity
  store:
    backend: memory # memory | sql (DSN in the secret file a2a.database_url)

streaming:
  activity: summary # delegated agents' activity is relayed, attributed by agent
  thinking: true
