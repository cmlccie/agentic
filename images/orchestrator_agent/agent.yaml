# agent.yaml — an orchestrator is an agent whose capabilities are other agents.
# Reference: images/orchestrator_agent/README.md
name: orchestrator-agent
description: An orchestrator that delegates tasks across specialist A2A agents

# Self-hosted OpenAI-compatible model (vLLM, SGLang, NVIDIA NIM); the endpoint comes
# from the secret files model.base_url / model.api_key or VLLM_BASE_URL / VLLM_API_KEY.
model: vllm:local-model

instructions: |
  You are an orchestrator that coordinates a team of specialist agents.

  Each specialist agent is available to you as a tool. Read the user's request,
  decide which agent(s) can fulfill it, and delegate by calling the appropriate
  tool(s) — you may call several agents to complete a single request. Give each
  agent a complete, self-contained request. Synthesize the agents' responses into
  a single, coherent answer for the user. If an agent is unavailable or fails,
  say so and answer as well as you can. If no specialist agent fits, answer
  directly.

model_settings:
  temperature: 0.2
  max_tokens: 4096

# Downstream A2A agents: one A2AAgent capability per agent. Each agent's card is
# fetched lazily to name and describe its delegation tool; an unreachable agent
# simply has no tool until it comes back. ${NAME} reads a secret file or env var.
capabilities: []
