[project]
name = "agentic"
version = "0.1.0"
description = "Agentic architecture components."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server,postgresql,telemetry]>=1.1.5",
    "fastapi>=0.141.1",
    "fastapi-openai-compat>=1.2.0",
    "fasta2a[pydantic-ai]>=2.0.1",
    "fastmcp>=4.0.10",
    "httpx>=0.28.1",
    "huggingface-hub>=2.0.0",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "mcp[cli]>=2.2.0",
    "openai>=3.19.2",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pg8000>=1.31.5",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[cli,mcp,openai,web]>=2.51.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=8.1.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]


# --------------------------------------------------------------------------------------
# Dependency Groups
# --------------------------------------------------------------------------------------

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]


# --------------------------------------------------------------------------------------
# Build System and Project Tooling
# --------------------------------------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[project.scripts]
simple-agent = "agentic.simple_agent.cli:app"
orchestrator-agent = "agentic.orchestrator_agent.cli:app"

# --------------------------------------------------------------------------------------
# Dependency Sources
# --------------------------------------------------------------------------------------

# Temporary override: use forked pydantic-ai until fix for issue-2818 is merged upstream.
# Remove this section and run `uv sync` once the fix is released to PyPI.
[tool.uv.sources]
# pydantic-ai-slim = { git = "https://github.com/pydantic/pydantic-ai.git", branch = "parallel-mcps", subdirectory = "pydantic_ai_slim" }
# pydantic-graph = { git = "https://github.com/pydantic/pydantic-ai.git", branch = "parallel-mcps", subdirectory = "pydantic_graph" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4

# Target Python 3.13
target-version = "py313"

[tool.ruff.lint]
# Pin the pre-0.16 ruff default rule set (E4, E7, E9, F) so ruff upgrades that
# expand the defaults do not silently change which rules apply.
select = [ "E4", "E7", "E9", "F" ]
# B: flake8-bugbear
# I: flake8-import-order
# Q: flake8-quotes
extend-select = [ "B", "I", "Q" ]
